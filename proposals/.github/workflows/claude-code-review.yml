name: Claude Code Review

# AGENT WORKFLOW 3 of 3 — reviews a pull request and comments findings.
#
# Capped per spec section 6. CI runs bill the same weekly Claude Pro quota as interactive
# work, so an uncapped agent job is a quota leak that surfaces as a failed demo rather than
# as a bill.
#
# HISTORY, kept because it is the reasoning that led here. `synchronize` was deliberately not
# a trigger: with it, every push to a branch starts a fresh review and a five-commit branch
# costs five runs. Then `opened` and `ready_for_review` went too, for the reason below. The
# direction of travel was always towards fewer automatic runs; this is the end of it.
#
# MEASURED, and wrong twice before this. Both failures were `error_max_turns`:
#
#   run 1  --max-turns 8    9 turns, 4m45s, $1.81, 16 denials, no review posted
#   run 2  --max-turns 25  26 turns, 2m25s, $0.99,  8 denials, no review posted
#
# The lesson is not "raise the number". It is that **`--max-turns` is the wrong instrument
# for bounding cost.** It stops the work halfway and charges full price for nothing, which is
# strictly worse than either finishing or never starting. Two runs and $2.80 bought no review
# at all. The documented example passes no turn limit; that was not an oversight.
#
# `timeout-minutes` is the correct bound, because wall-clock time is what actually tracks
# quota spend. Run 2 used 2m25s of a 15-minute budget, so the real limit was never in sight.
#
# The allowlist matters separately: it halved the denials between runs (16 -> 8), each of
# which burns a turn on being refused. Everything permitted here is read-only — reviewing is
# not editing.
#
# COST: expect roughly $1-2 of quota-equivalent per successful review, and $3.75 for the one
# that produced real findings. This is the single most expensive thing in the repository, which
# is why it now runs only when someone asks for it.
#
# Draft-by-default still matters, but for the other jobs rather than this one: a draft runs the
# checks, the build and the preview — all free — and this workflow no longer fires on any pull
# request event at all, drafted or not.

# TURNED OFF AS AN AUTOMATIC TRIGGER ON 2026-09-15, after measuring it.
#
#   58 runs, 52 of them "successful"
#    2 inline comments, ever — on pull requests #22 and #26
#    0 across the last fifteen pull requests, #41 to #61
#
# Nothing posted on anything merged in a week of daily use. The race described below is not
# an occasional miss; it is the normal outcome. A review that does not arrive is not advice,
# and it is not free — it is the most expensive job in this repository.
#
# It is not deleted, because when it wins the race it is genuinely good: 35 turns, seven
# findings, two of which were about to break the live demo, and neither caught by a human
# reading the same text. So it becomes something you ASK for rather than something that fires
# and says nothing.
#
# There is a second reason beyond cost. Draft-by-default plus a review on `ready_for_review`
# means every merge ends with a mandatory agent run, because a draft cannot be merged without
# being marked ready. That made the cheap iteration loop expensive at exactly the last step.
#
# TO RUN ONE:
#
#   gh workflow run "Claude Code Review" -f pr=62
#
# or comment `@claude review this PR` on the pull request, which goes through claude.yml and
# has never failed.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string

concurrency:
  group: review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The two guards this job used to carry are gone with the automatic trigger, and both
    # were made redundant by it rather than dropped:
    #
    #   - Fork pull requests. `workflow_dispatch` can only be started by someone with write
    #     access on this repository, so a stranger's fork can no longer start a run at all.
    #     That is a stronger guarantee than the `if:` was, not a weaker one.
    #   - Bot-authored pull requests. `agent-intent.yml` used to trigger this and leave a red
    #     X on every drafted intent. A workflow nobody triggers cannot be triggered by a bot.
    #
    # Reviewing a fork's contribution now means pushing the branch to this repository first
    # and dispatching against that, which is the same thing the old guard told you to do.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # write, not read: two runs completed successfully and posted nothing at all.
      # The action needs to create review comments, and reading a diff is not enough to
      # write on it. Still no contents write — reviewing is not editing.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr }}'
          # show_full_output is off again. It was enabled for two runs to find out why six
          # reviews had completed and posted nothing, and it answered the question — one of
          # those two runs reviewed properly and one did not, which ruled the flag out as the
          # cause and pointed at the real one.
          #
          # THE FINDING. The review does not decline. Its own eligibility check concluded
          # "it NEEDS code review — not a trivial change", and then the run ended anyway. The
          # last thing the model says is:
          #
          #   "Waiting for the two background agents (PR eligibility check, CLAUDE.md
          #    discovery) to complete before continuing."
          #
          # It spawns background subagents, yields its turn to wait for them, and the session
          # ends. Nothing wakes it. When they happen to report back first the review is
          # excellent — 35 turns, seven findings, two of them demo-breaking. When they do not,
          # it costs $0.15 and says nothing. That is a race, which is why the durations have
          # no pattern: 137s, 5m49s, 23s, 9m11s, 57s.
          #
          # `Skill` is added to the allowlist because it was the one denied tool in the silent
          # runs. It may not be the trigger — the waiting behaviour is inside the plugin and
          # not something this workflow can reach — but a denial in the middle of an
          # orchestration that is already racing is worth removing.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
