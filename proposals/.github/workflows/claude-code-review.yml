name: Claude Code Review

# AGENT WORKFLOW 3 of 3 — reviews a pull request and comments findings.
#
# Capped per spec section 6. CI runs bill the same weekly Claude Pro quota as interactive
# work, so an uncapped agent job is a quota leak that surfaces as a failed demo rather than
# as a bill.
#
# `synchronize` is deliberately NOT a trigger. With it, every push to a PR branch starts a
# fresh review: a five-commit branch costs five runs. The review fires once when the pull
# request is ready, and a human can ask for another by commenting `@claude review this again`.
#
# MEASURED, and wrong twice before this. Both failures were `error_max_turns`:
#
#   run 1  --max-turns 8    9 turns, 4m45s, $1.81, 16 denials, no review posted
#   run 2  --max-turns 25  26 turns, 2m25s, $0.99,  8 denials, no review posted
#
# The lesson is not "raise the number". It is that **`--max-turns` is the wrong instrument
# for bounding cost.** It stops the work halfway and charges full price for nothing, which is
# strictly worse than either finishing or never starting. Two runs and $2.80 bought no review
# at all. The documented example passes no turn limit; that was not an oversight.
#
# `timeout-minutes` is the correct bound, because wall-clock time is what actually tracks
# quota spend. Run 2 used 2m25s of a 15-minute budget, so the real limit was never in sight.
#
# The allowlist matters separately: it halved the denials between runs (16 -> 8), each of
# which burns a turn on being refused. Everything permitted here is read-only — reviewing is
# not editing.
#
# COST: expect roughly $1-2 of quota-equivalent per successful review. This is the single most
# expensive thing in the repository. Open pull requests as DRAFTS while iterating — the review
# skips drafts — and mark them ready when a review is actually wanted.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Same-repository pull requests only. On a public repository anyone can open a fork pull
    # request; GitHub withholds the OAuth token from those, so the run would fail rather than
    # spend quota — but not starting is cheaper and clearer. Review outside contributions by
    # hand, or push the branch to this repository first.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # write, not read: two runs completed successfully and posted nothing at all.
      # The action needs to create review comments, and reading a diff is not enough to
      # write on it. Still no contents write — reviewing is not editing.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
