name: Claude Code

# AGENT WORKFLOW 1 of 3 — the steering wheel. Responds to @claude in issues and PRs.
#
# Two changes from the version `/install-github-app` generated:
#
#  1. Caps: timeout, concurrency, --max-turns and an explicit model. Without them a single
#     confused run can consume a meaningful slice of the weekly Pro quota (spec section 6).
#
#  2. contents/pull-requests raised from read to write, so Claude can push a branch and open
#     a pull request when asked to implement something. This is Stage 3 of the SDLC and does
#     not work with read-only permissions.
#
#     This grants no path to production. `main` is reached only through a pull request a
#     human merges, and the deploy credential lives in the `production` environment behind a
#     required approval (spec D6). Widening this is what makes the agent useful; the gate is
#     what makes it safe.
#
# Note: do NOT pass `github_token: ${{ secrets.GITHUB_TOKEN }}` here. Without it the action
# authenticates as the Claude GitHub App, which means CI runs on the commits Claude pushes.
# With it, GitHub suppresses those workflow runs and the verification loop silently stops
# verifying anything the agent writes.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 20
            --model claude-sonnet-5
