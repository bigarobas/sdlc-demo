name: Control bands

# STAGE 6 (Maintain) — and the step that hands the loop back to a human.  [spec D3]
#
# A breach opens an issue labelled `control-band`. It does NOT apply the `intent` label, and
# that is a deliberate correction rather than an omission.
#
# The first version applied `intent` too, expecting `agent-intent.yml` to pick it up and close
# the circle unattended. It never fired, because GitHub does not create new workflow runs from
# events triggered by the repository's GITHUB_TOKEN — a platform rule that exists precisely to
# stop bots triggering bots.
#
# A personal access token would defeat that rule. It should not, for two reasons. The platform
# is protecting against a real failure mode: a monitoring loop that opens issues that spawn
# agents that change the site that breaches a band. And the playbook already says the service
# owner triages maintenance findings — a breach is evidence, not yet a decision.
#
# So the closing step is a human applying the `intent` label. That takes one click, produces
# a genuine triage decision, and turns Stage 6 into Stage 1 exactly as designed.
#
# Not one token is spent here. That is deliberate and it is the point: the half of the loop
# that proves autonomy is the half that cannot fail because a weekly quota ran out. Fetch,
# a threshold, an exit code, `gh issue create`.
#
# `workflow_dispatch` is included so the breach can be demonstrated on demand rather than
# waited for — lower a threshold in bands.yaml, run this, watch an issue appear.

on:
  schedule:
    - cron: '17 */6 * * *' # not on the hour: shared runners are busiest then
  workflow_dispatch:

concurrency:
  group: bands
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to open the intent issue
  actions: read # to read verify.yml run durations for the build_time band

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check bands
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/check-bands.mjs > breach.md
          echo "breached=$?" >> "$GITHUB_OUTPUT"
          set -e

      # One open issue per breach, not one every six hours. An alert that repeats itself is
      # an alert people learn to ignore, which is how monitoring quietly stops working.
      - name: Open an intent issue
        if: steps.check.outputs.breached == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label control-band --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "A control-band issue is already open; not opening another."
            exit 0
          fi
          gh issue create \
            --title "Control band breached on the live site" \
            --label control-band \
            --body-file breach.md

      - name: Notify Slack
        if: ${{ steps.check.outputs.breached == '1' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload='{"text":"Control band breached on https://rashid.fr/sdlc/ — an intent issue was opened."}'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || echo 000)
          [ "$code" = "200" ] || echo "::warning::Slack notification failed (HTTP $code)"
