name: Intent
description: Propose a change. This is Stage 1 of the SDLC — describe the problem, not the solution.
title: '[intent] '
# Deliberately NOT `labels: [intent]`. A template that applies the label files an issue that
# is already labelled, which fires agent-intent.yml at creation and removes the triage step
# entirely — the decision to process something would be made by the act of describing it.
#
# Leaving it off keeps the two separable: anyone may describe a problem; deciding it is worth
# an agent's time takes write access, and is a thing a person does on purpose.
body:
  - type: markdown
    attributes:
      value: |
        **This issue starts unlabelled, on purpose.** Filing it costs nothing and commits
        nobody to anything.

        Applying the `intent` label afterwards is the triage decision, and it runs an agent
        that drafts `docs/sdlc/NNNN-slug/intent.md` and opens a pull request. It writes no
        code, and a human reviews the framing before any design work starts.

        Describe the problem. If you already know the solution, put it in Constraints as a
        decision that has been made, so the reasoning stays visible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong today, for whom, and how do you know?
      placeholder: Observable, not speculative.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: What is true once this is done? Written so someone else could tell whether it happened.
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: Affected systems
      placeholder: site/, deploy workflow, FTP host
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Deadlines, budget, token cost, decisions already made elsewhere.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions a human must make. Name the decision, not just the topic.
