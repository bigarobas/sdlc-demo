name: Intent
description: Propose a change. This is Stage 1 of the SDLC — describe the problem, not the solution.
title: '[intent] '
labels: [intent]
body:
  - type: markdown
    attributes:
      value: |
        Adding the `intent` label runs an agent that drafts `docs/sdlc/NNNN-slug/intent.md`
        and opens a pull request. It writes no code. You review the framing before any
        design work starts.

        Describe the problem. If you already know the solution, put it in Constraints as a
        decision that has been made, so the reasoning stays visible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong today, for whom, and how do you know?
      placeholder: Observable, not speculative.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: What is true once this is done? Written so someone else could tell whether it happened.
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: Affected systems
      placeholder: site/, deploy workflow, FTP host
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Deadlines, budget, token cost, decisions already made elsewhere.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions a human must make. Name the decision, not just the topic.
