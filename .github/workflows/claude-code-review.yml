name: Claude Code Review

# AGENT WORKFLOW 3 of 3 — reviews a pull request and comments findings.
#
# Capped per spec section 6. CI runs bill the same weekly Claude Pro quota as interactive
# work, so an uncapped agent job is a quota leak that surfaces as a failed demo rather than
# as a bill.
#
# `synchronize` is deliberately NOT a trigger. With it, every push to a PR branch starts a
# fresh review: a five-commit branch costs five runs. The review fires once when the PR is
# ready, and a human can ask for another by commenting `@claude review this again`.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --max-turns 8
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
