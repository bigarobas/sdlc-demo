name: Verify

# STAGE 4 (Test) — deterministic, free, and the only thing allowed to say "it works".
#
# No agent runs here. Build, link check and evals cost nothing but runner minutes, so this
# can fire on every push without touching the Pro quota. That is the point of keeping the
# expensive stages few: the cheap ones can then be relentless.
#
# Both deploy targets are subfolders, so the matrix checks both bases. A base-path bug that
# only appears in production is a bug that first appears on stage.

on:
  push:
    branches: [main]
    # The app boundary. A change outside these paths cannot alter the built site, so
    # building or deploying it would prove nothing. Repeated in verify.yml, preview.yml and
    # deploy.yml: GitHub cannot share a path list between workflows, so the duplication is
    # deliberate and each copy carries this note.
    paths:
      - 'site/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    # The app boundary. A change outside these paths cannot alter the built site, so
    # building or deploying it would prove nothing. Repeated in verify.yml, preview.yml and
    # deploy.yml: GitHub cannot share a path list between workflows, so the duplication is
    # deliberate and each copy carries this note.
    paths:
      - 'site/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated explicitly rather than inherited. This is the one workflow that
# deliberately DOES run on fork pull requests — that is what CI is for — which means it
# executes untrusted code: npm lifecycle scripts from the pull request's lockfile, and the
# pull request's own source at build time.
#
# That is acceptable only because there is nothing here worth stealing: no secrets are passed
# to fork runs, and this token can read and nothing else. The remaining exposure is your
# Actions minutes, which is why "Require approval for all outside collaborators" is set in
# Settings -> Actions -> General. Nothing from a stranger runs until a human clicks.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            base: sdlc
          - name: preview
            base: sdlc-preview

    name: verify (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix site

      - name: Verify
        env:
          VERIFY_BASE: ${{ matrix.base }}
        run: npm run verify

      - name: Check formatting
        run: npx prettier --check .
