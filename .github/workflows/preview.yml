name: Preview

# STAGE 5 (Deploy), the reviewable half — every pull request gets a live URL.
#
# A reviewer who can click the change catches what a diff hides.
#
# THREE TIERS OF CREDENTIAL REACH. This workflow is the middle one, and the reason it uses a
# different FTP account from `deploy.yml` is the whole point:
#
#   tier          declares                gate               can reach
#   ------------  ----------------------  -----------------  ---------------------
#   agent, verify  nothing                 —                  no credential at all
#   preview        environment: preview    none, deliberately  /www/sdlc-preview/
#   production     environment: production required reviewer   /www/sdlc/
#
# The `preview` environment has NO protection rules, on purpose: it must run unattended on
# every pull request, and a reviewer rule would park each one waiting for a human. That is
# safe only because the credential it holds is scoped — its FTP user is chrooted to the
# preview directory and cannot touch the live site.
#
# Environments are about blast radius. Approval is a separate axis layered on top of it.
#
# Using an environment rather than repository secrets also keeps these credentials away from
# `claude.yml`, which runs agent work driven by whatever someone typed into an issue. A
# repository secret would be readable there; an environment secret is not.
#
# Previously this published to GitHub Pages. Pages vanished the moment the repository was
# briefly made private, which is a good argument for running the pipeline on infrastructure
# you own.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Gives the pull request a clickable "View deployment" link, so no comment step is needed.
    environment:
      name: preview
      url: https://rashid.fr/sdlc-preview/

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix site

      # Verify at the preview base before publishing it. This is the run that catches a
      # base-path bug, because the preview path is not the production one.
      - name: Verify
        env:
          VERIFY_BASE: sdlc-preview
        run: npm run verify

      - name: Build for preview
        run: >-
          npm --prefix site run build --
          --site https://rashid.fr
          --base /sdlc-preview/

      - name: Publish over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_PREVIEW_SERVER }}
          username: ${{ secrets.FTP_PREVIEW_USERNAME }}
          password: ${{ secrets.FTP_PREVIEW_PASSWORD }}
          local-dir: ./site/dist/
          # './' and not '/www/sdlc-preview/': this FTP user is chrooted, so its login root
          # already IS the preview directory. Giving the absolute path would try to create
          # /www/sdlc-preview/www/sdlc-preview/.
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
