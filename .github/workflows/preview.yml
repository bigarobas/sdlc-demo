name: Preview

# STAGE 5 (Deploy), the reviewable half — every pull request gets a live URL.
#
# A reviewer who can click the change catches what a diff hides.
#
# THREE TIERS OF CREDENTIAL REACH. This workflow is the middle one, and the reason it uses a
# different FTP account from `deploy.yml` is the whole point:
#
#   tier          declares                gate               can reach
#   ------------  ----------------------  -----------------  ---------------------
#   agent, verify  nothing                 —                  no credential at all
#   preview        environment: preview    none, deliberately  /www/sdlc-preview/
#   production     environment: production required reviewer   /www/sdlc/
#
# The `preview` environment has NO protection rules, on purpose: it must run unattended on
# every pull request, and a reviewer rule would park each one waiting for a human. That is
# safe only because the credential it holds is scoped — its FTP user is chrooted to the
# preview directory and cannot touch the live site.
#
# Environments are about blast radius. Approval is a separate axis layered on top of it.
#
# Using an environment rather than repository secrets also keeps these credentials away from
# `claude.yml`, which runs agent work driven by whatever someone typed into an issue. A
# repository secret would be readable there; an environment secret is not.
#
# Previously this published to GitHub Pages. Pages vanished the moment the repository was
# briefly made private, which is a good argument for running the pipeline on infrastructure
# you own.

on:
  pull_request:
    # `closed` is new, and it is the cleanup. Without it every merged or abandoned pull
    # request leaves its directory on the host forever, and the FTP action will not remove
    # what it did not create.
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # The app boundary. A change outside these paths cannot alter the built site, so
    # building or deploying it would prove nothing. Repeated in verify.yml, preview.yml and
    # deploy.yml: GitHub cannot share a path list between workflows, so the duplication is
    # deliberate and each copy carries this note.
    paths:
      - 'site/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'

# ONE PREVIEW PER PIECE OF WORK, not one for the whole repository.
#
# This used to be `group: preview` with `cancel-in-progress: true`, which meant two open pull
# requests fought over a single URL and cancelled each other's runs. Whoever pushed last owned
# https://rashid.fr/sdlc-preview/, and the pull request comment said so — "the most recently
# updated pull request wins" — which is a sentence describing a bug as a feature.
#
# That is tolerable with one person and one change in flight. It is the first thing to break
# when several intents run at once. Keyed on the pull request number rather than the slug,
# because the group is evaluated before any step runs and the slug is computed in one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Same-repository pull requests only. GitHub already withholds secrets from fork pull
    # requests, so a fork could not publish anything — but without this guard it would try,
    # fail obscurely on empty credentials, and leave a red check that looks like a bug in
    # the pipeline rather than a control working. Fail by not starting.
    #
    # And not when the pull request is closing — that event runs the cleanup job instead.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.slug.outputs.slug }}

    # The repository default is read-only, and posting the preview comment is a write. This
    # is the same trap the review workflow appears to be sitting in: a job that reads a pull
    # request fine and silently cannot write on it. Nothing else is granted — publishing goes
    # over FTP, not through the GitHub token.
    permissions:
      contents: read
      pull-requests: write

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    environment:
      name: preview
      url: https://rashid.fr/sdlc-preview/

    steps:
      - uses: actions/checkout@v7

      # THE SLUG. One preview directory per piece of work, derived from the branch name.
      #
      # `intent/0062-credits-section` gives `0062`, so the URL matches the artifact directory
      # and a reader can get from one to the other without asking anybody. A branch with no
      # intent id — a chore, a hotfix — falls back to `pr-<number>`, which is always present
      # and always unique.
      #
      # Deliberately NOT the branch name itself: those contain slashes, and a slug that can
      # contain a slash is a path traversal waiting to be interesting on a live FTP account.
      # The grep below reduces to digits, or a pr- prefix, and nothing else survives it.
      - name: Work out the preview slug
        id: slug
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          id=$(printf '%s' "$branch" | grep -oE '[0-9]{4,}' | head -1 || true)
          if [ -n "$id" ]; then slug="$id"; else slug="pr-${{ github.event.pull_request.number }}"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Preview slug: $slug"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix site

      # Verify at the preview base before publishing it. This is the run that catches a
      # base-path bug, because the preview path is not the production one.
      #
      # VERIFY_BASE now carries the slug, so the link crawl runs against the path this build
      # will actually live at. `normaliseBase()` in scripts/verify.mjs strips leading and
      # trailing slashes and re-wraps, so a nested value works — but it has only ever been
      # given a single segment before, and a base-path bug that only appears two levels deep
      # is exactly the class of thing this step exists to catch. Worth watching on the first
      # run rather than assuming.
      - name: Verify
        env:
          VERIFY_BASE: sdlc-preview/${{ steps.slug.outputs.slug }}
        run: npm run verify

      # BUILD_ENV marks this build as a preview, which is what puts the marker in the nav so
      # a cropped screenshot cannot be mistaken for production. PR_NUMBER comes straight from
      # the event here — production has to parse it out of a commit subject instead, which is
      # the fragile half of the same feature.
      #
      # Nothing reads either until intent 0001 ships. They are set first on purpose: without
      # them, the preview of that implementation would render the marker and the number
      # switched off, which are precisely the parts worth reviewing.
      - name: Build for preview
        env:
          BUILD_ENV: preview
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          npm --prefix site run build --
          --site https://rashid.fr
          --base /sdlc-preview/${{ steps.slug.outputs.slug }}/

      - name: Publish over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_PREVIEW_SERVER }}
          username: ${{ secrets.FTP_PREVIEW_USERNAME }}
          password: ${{ secrets.FTP_PREVIEW_PASSWORD }}
          local-dir: ./site/dist/
          # './<slug>/' and not '/www/sdlc-preview/<slug>/': this FTP user is chrooted, so its
          # login root already IS the preview directory. Giving the absolute path would try to
          # create /www/sdlc-preview/www/sdlc-preview/.
          #
          # Still the same chrooted account. Per-intent directories change the blast radius
          # not at all — this credential could never reach the live site, and still cannot.
          server-dir: ./${{ steps.slug.outputs.slug }}/
          # One state file per slug. Sharing one across previews would make each deploy think
          # the others' files were its own and delete them.
          state-name: .ftp-deploy-sync-state.json

      # Say where it went, on the pull request itself. GitHub does surface the environment
      # URL, but in the Deployments box, which is easy to never notice — and a preview nobody
      # can find is a preview that does not exist. One comment, edited in place on each push
      # rather than a new one every time.
      - name: Comment the preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const sha = context.sha.slice(0, 7);
            const slug = '${{ steps.slug.outputs.slug }}';
            const base = context.payload.pull_request.base.sha.slice(0, 7);
            const body = [
              marker,
              '**Preview:** https://rashid.fr/sdlc-preview/' + slug + '/',
              '',
              'Built from ' + sha + ' — this pull request merged into `' + base + '`, which was',
              '`main` when this ran. If `main` has moved since, this is not what merging will',
              'produce; push again to rebuild against the current base.',
              '',
              'This URL belongs to this pull request and nothing else overwrites it. It is',
              'deleted when the pull request closes.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find((c) => c.body?.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Only when a pull request opens or is marked ready — never on synchronize. A ping for
      # every push to a branch is the kind of notification people mute, and a muted channel is
      # where the deploy-waiting message would have died too.
      - name: Tell Slack a preview is up
        if: >-
          ${{ env.SLACK_WEBHOOK_URL != '' &&
              (github.event.action == 'opened' || github.event.action == 'ready_for_review') }}
        run: |
          # jq, so a pull request title containing a quote cannot break the payload.
          payload=$(jq -n \
            --arg n "${{ github.event.pull_request.number }}" \
            --arg t "${{ github.event.pull_request.title }}" \
            --arg s "${{ steps.slug.outputs.slug }}" \
            '{text: ("Preview ready for #" + $n + " — " + $t + "\nhttps://rashid.fr/sdlc-preview/" + $s + "/"),
              unfurl_links: true, unfurl_media: true}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || echo 000)
          [ "$code" = "200" ] || echo "::warning::Slack notification failed (HTTP $code)"

  # ---------------------------------------------------------------------------------------
  # CLEANUP. The half people forget, and the reason per-pull-request previews turn into a
  # full disk six months later.
  #
  # SamKirkland/FTP-Deploy-Action only ever adds and updates; it will not delete a directory
  # it did not create. So emptying the folder is done by deploying an empty directory into it
  # with `dangerous-clean-slate`, which removes everything in `server-dir` first. The now-empty
  # directory itself remains, costing an inode and nothing else.
  #
  # `dangerous-clean-slate` earns its name — it is destructive by design, and pointed at a
  # path built from `slug`. That is why `slug` is reduced to digits or `pr-<number>` in the
  # job above and can contain nothing else: a slug that could hold `..` or `/` would make this
  # step delete something that was never a preview.
  # ---------------------------------------------------------------------------------------
  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    environment:
      name: preview

    steps:
      - name: Work out the preview slug
        id: slug
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          id=$(printf '%s' "$branch" | grep -oE '[0-9]{4,}' | head -1 || true)
          if [ -n "$id" ]; then slug="$id"; else slug="pr-${{ github.event.pull_request.number }}"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Removing preview: $slug"

      - name: Empty the directory
        run: mkdir -p empty

      - name: Wipe the preview over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_PREVIEW_SERVER }}
          username: ${{ secrets.FTP_PREVIEW_USERNAME }}
          password: ${{ secrets.FTP_PREVIEW_PASSWORD }}
          local-dir: ./empty/
          server-dir: ./${{ steps.slug.outputs.slug }}/
          dangerous-clean-slate: true
